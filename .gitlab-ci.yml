variables:
  CONTAINER_PATH: "harbor.faceunity.com/nama/web-demo"

stages:
  - build
  - deploy-prod

  # 安装依赖的作业
build-test:
  tags: 
    - gfw
  only:
    - tags
  stage: build
  script:
    - docker -v
    - docker build --rm -t ${CONTAINER_PATH}:${CI_BUILD_TAG}-test --build-arg APP_ENV=test .
    - docker push ${CONTAINER_PATH}:${CI_BUILD_TAG}-test

build-prod:
  stage: build
  tags: 
    - gfw
  only:
    - tags
  script:
    - docker -v
    - docker build -t ${CONTAINER_PATH}:${CI_BUILD_TAG}-prod --build-arg APP_ENV=prod .
  when: manual

deploy-prod:
  tags: 
    - gfw
  only:
    - tags
  stage: deploy-prod
  script:
    - docker push ${CONTAINER_PATH}:${CI_BUILD_TAG}-prod
    - docker rmi ${CONTAINER_PATH}:${CI_BUILD_TAG}-prod
  when: manual
